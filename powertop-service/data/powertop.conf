# Add tunable options below

# DISABLE: Runtime PM for PCI Device Intel Corporation Ethernet Controller I226-V
echo 'on' > '/sys/bus/pci/devices/0000:03:00.0/power/control'
# DISABLE: Runtime PM for PCI Device Intel Corporation Ethernet Controller I226-LM
echo 'on' > '/sys/bus/pci/devices/0000:04:00.0/power/control'


# Enable "powersave" cpu scaling governor
echo "powersave" | tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor


# NMI watchdog should be turned off
echo '0' > '/proc/sys/kernel/nmi_watchdog'
# VM writeback timeout
echo '1500' > '/proc/sys/vm/dirty_writeback_centisecs'
# Enable SATA link power management for host0
echo 'med_power_with_dipm' > '/sys/class/scsi_host/host0/link_power_management_policy'
# Enable SATA link power management for host1
echo 'med_power_with_dipm' > '/sys/class/scsi_host/host1/link_power_management_policy'
# Enable SATA link power management for host2
echo 'med_power_with_dipm' > '/sys/class/scsi_host/host2/link_power_management_policy'
# Enable SATA link power management for host3
echo 'med_power_with_dipm' > '/sys/class/scsi_host/host3/link_power_management_policy'
# Enable SATA link power management for host4
echo 'med_power_with_dipm' > '/sys/class/scsi_host/host4/link_power_management_policy'
# Enable SATA link power management for host5
echo 'med_power_with_dipm' > '/sys/class/scsi_host/host5/link_power_management_policy'
# Enable SATA link power management for host6
echo 'med_power_with_dipm' > '/sys/class/scsi_host/host6/link_power_management_policy'
# Enable SATA link power management for host7
echo 'med_power_with_dipm' > '/sys/class/scsi_host/host7/link_power_management_policy'
# Runtime PM for port ata1 of PCI device: Intel Corporation Alder Lake-S PCH SATA Controller [AHCI Mode]
echo 'auto' > '/sys/bus/pci/devices/0000:00:17.0/ata1/power/control'
# Runtime PM for port ata2 of PCI device: Intel Corporation Alder Lake-S PCH SATA Controller [AHCI Mode]
echo 'auto' > '/sys/bus/pci/devices/0000:00:17.0/ata2/power/control'
# Runtime PM for port ata3 of PCI device: Intel Corporation Alder Lake-S PCH SATA Controller [AHCI Mode]
echo 'auto' > '/sys/bus/pci/devices/0000:00:17.0/ata3/power/control'
# Runtime PM for port ata4 of PCI device: Intel Corporation Alder Lake-S PCH SATA Controller [AHCI Mode]
echo 'auto' > '/sys/bus/pci/devices/0000:00:17.0/ata4/power/control'
# Runtime PM for port ata5 of PCI device: Intel Corporation Alder Lake-S PCH SATA Controller [AHCI Mode]
echo 'auto' > '/sys/bus/pci/devices/0000:00:17.0/ata5/power/control'
# Runtime PM for port ata6 of PCI device: Intel Corporation Alder Lake-S PCH SATA Controller [AHCI Mode]
echo 'auto' > '/sys/bus/pci/devices/0000:00:17.0/ata6/power/control'
# Runtime PM for port ata7 of PCI device: Intel Corporation Alder Lake-S PCH SATA Controller [AHCI Mode]
echo 'auto' > '/sys/bus/pci/devices/0000:00:17.0/ata7/power/control'
# Runtime PM for port ata8 of PCI device: Intel Corporation Alder Lake-S PCH SATA Controller [AHCI Mode]
echo 'auto' > '/sys/bus/pci/devices/0000:00:17.0/ata8/power/control'
# Runtime PM for PCI Device Intel Corporation Alder Lake-S PCH Shared SRAM
echo 'auto' > '/sys/bus/pci/devices/0000:00:14.2/power/control'
# Runtime PM for PCI Device Intel Corporation Alder Lake-S PCH SATA Controller [AHCI Mode]
echo 'auto' > '/sys/bus/pci/devices/0000:00:17.0/power/control'
# Runtime PM for PCI Device Intel Corporation Alder Lake-S PCH SPI Controller
echo 'auto' > '/sys/bus/pci/devices/0000:00:1f.5/power/control'
